<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchromatic Studios</title>
    <style>
        /* RESET & BASICS */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #050505; /* Near Black */
            color: #e0e0e0; 
            font-family: 'Courier New', Courier, monospace; /* Terminal/Code aesthetic */
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TYPOGRAPHY */
        h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 1rem;
            color: #666;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 3rem;
            border-bottom: 1px solid #333;
            display: inline-block;
            padding-bottom: 5px;
        }

        h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        p { margin-bottom: 1.5rem; max-width: 600px; margin-left: auto; margin-right: auto; }

        a { color: #fff; text-decoration: none; transition: 0.3s; }
        a:hover { color: #aaa; }

        /* LAYOUT */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        /* HERO VISUAL: The "Digital Pixel" Icon */
        .pixel-icon {
            width: 120px;
            height: 120px;
            background: 
                linear-gradient(to right, #333 1px, transparent 1px),
                linear-gradient(to bottom, #333 1px, transparent 1px);
            background-size: 10px 10px;
            border: 2px solid #fff;
            margin-bottom: 2rem;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* PROJECT LIST */
        .project-list {
            list-style: none;
            margin-top: 2rem;
            border-top: 1px solid #222;
            padding-top: 2rem;
            width: 100%;
            max-width: 400px;
        }
        
        .project-list li {
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .status {
            color: #555;
            font-size: 0.8rem;
        }

        /* FOOTER */
        footer {
            padding: 2rem;
            text-align: center;
            font-size: 0.7rem;
            color: #333;
        }

        /* UTILITY */
        .btn {
            display: inline-block;
            border: 1px solid #fff;
            padding: 12px 25px;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: 2rem;
        }
        .btn:hover {
            background: #fff;
            color: #000;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="pixel-icon"></div>

        <h1>Panchromatic</h1>
        <h2>Independent Game Studio</h2>

        <p>
            Crafting immersive digital worlds. <br>
            Focusing on atmospheric gameplay and emergent mechanics.
        </p>

        <ul class="project-list">
            <li>
                <span>Pocket Arboretum</span>
                <span class="status">[In Development]</span>
            </li>
            <li>
                <span>Project: Unannounced</span>
                <span class="status">[Prototyping]</span>
            </li>
        </ul>

        <a href="mailto:contact@panchromaticstudios.com" class="btn">Get in Touch</a>
    </div>

    <footer>
        &copy; 2026 Panchromatic Studios. <br>
        Built with Godot & Unreal Engine technology.
    </footer>

</body>
</html>
