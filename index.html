<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchromatic Studios</title>
    <style>
        /* RESET & BASICS */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0a0a0a; /* Deep Black */
            color: #f0f0f0; /* Off-white for readability */
            font-family: 'Courier New', Courier, monospace; /* Script-style font */
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* TYPOGRAPHY */
        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            font-weight: normal;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 1.2rem;
            color: #888;
            font-weight: normal;
            margin-bottom: 2rem;
        }

        p { margin-bottom: 1.5rem; max-width: 600px; }

        a { color: #fff; text-decoration: underline; text-decoration-color: #555; transition: 0.3s; }
        a:hover { color: #ccc; text-decoration-color: #fff; }

        /* LAYOUT */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        /* HERO VISUAL (Placeholder for a showreel or image) */
        .lens-ring {
            width: 150px;
            height: 150px;
            border: 2px solid #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            position: relative;
        }
        
        /* Subtle animation for the lens */
        .lens-ring::after {
            content: '';
            width: 130px;
            height: 130px;
            border: 1px solid #555;
            border-radius: 50%;
            position: absolute;
        }

        /* FOOTER */
        footer {
            padding: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #444;
            border-top: 1px solid #1a1a1a;
        }

        /* UTILITY */
        .btn {
            display: inline-block;
            border: 1px solid #fff;
            padding: 10px 20px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .btn:hover {
            background: #fff;
            color: #000;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .lens-ring { width: 100px; height: 100px; }
            .lens-ring::after { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lens-ring"></div>

        <h1>Panchromatic Studios</h1>
        <h2>Film • Television • Production</h2>

        <p>
            Visual storytelling with a focus on technical precision. 
            From custom cinema robotics to narrative production.
        </p>

        <a href="mailto:contact@panchromaticstudios.com" class="btn">Contact Us</a>
    </div>

    <footer>
        &copy; 2026 Panchromatic Studios. All rights reserved.
    </footer>

</body>
</html>
